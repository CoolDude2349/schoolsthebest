<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'unsafe-inline' 'unsafe-eval' blob: data: https://www.gstatic.com;">

  <title>Google Drive Picker with OAuth2</title>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
</head>
<body>

<h1>Access Your Google Drive Files</h1>
<button id="authorize_button" style="display: block;">Authorize</button>
<button id="pick_button" style="display: none;">Pick a File from Google Drive</button>
<div id="result"></div>

<script>
  let tokenClient;
  let accessToken = null;
  let pickerInited = false;
  let gisInited = false;
  const CLIENT_ID = '610592782662-rbppqf6dc337src2uqqbqooracmseof4.apps.googleusercontent.com'; // Replace with your OAuth 2.0 Client ID
  const API_KEY = 'AIzaSyDJZwv-QKw45WV-TU-y0cAmqSFjo7n04oI'; // Replace with your API Key
  const SCOPES = 'https://www.googleapis.com/auth/drive.file'; // Adjust the scope as needed

  // Load the Google APIs
  function onApiLoad() {
    gapi.load('client', initClient);
  }

  function initClient() {
    gapi.client.init({
      apiKey: API_KEY,
      clientId: CLIENT_ID,
      scope: SCOPES,
      discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
    }).then(() => {
      console.log('Google API Client initialized');
      pickerInited = true;
    });
  }

  // OAuth2 Initialization
  function gisLoaded() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: '', // Defined later
    });
    gisInited = true;
  }

  // Handle OAuth2 login
  function handleAuthClick() {
    tokenClient.requestAccessToken({prompt: 'consent'});
  }

  // Callback for token request
  function onAuthTokenReceived(response) {
    if (response.error) {
      console.error(response.error);
      return;
    }
    accessToken = response.access_token;
    document.getElementById('authorize_button').style.display = 'none';
    document.getElementById('pick_button').style.display = 'block';
    showPicker();
  }

  // Create and show the Picker
  function showPicker() {
    const picker = new google.picker.PickerBuilder()
      .addView(google.picker.ViewId.DOCS)
      .setOAuthToken(accessToken)
      .setDeveloperKey(API_KEY)
      .setCallback(pickerCallback)
      .build();
    picker.setVisible(true);
  }

  // Handle the result from the Picker
  function pickerCallback(data) {
    const url = data[google.picker.Response.ACTION] === google.picker.Action.PICKED
      ? data[google.picker.Response.DOCUMENTS][0].url
      : 'No file selected';

    document.getElementById('result').textContent = `You picked: ${url}`;
  }

  // Initialize the authentication flow
  function init() {
    if (gisInited && pickerInited) {
      document.getElementById('authorize_button').addEventListener('click', handleAuthClick);
      document.getElementById('pick_button').addEventListener('click', showPicker);
    }
  }

  // Load Google APIs and OAuth client
  gapi.load('client:auth2', initClient);
  window.onload = gisLoaded;

</script>
</body>
</html>
